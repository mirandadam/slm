name: CI

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # The packages eframe's README lists for building on Ubuntu.
      - run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # The tests that render images are ignored, because the runners have no graphics adapter.
      - run: cargo test
